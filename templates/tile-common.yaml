# PLACEHOLDER until Hardware Designer's real template lands. Replace this file.
# It consumes the substitutions written by tools/gen_tiles.py.
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
logger:
api:
  encryption:
    key: !secret ${api_key_secret}
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
light:
  - platform: esp32_rmt_led_strip
    id: tile_leds
    name: None
    pin: ${pin}
    num_leds: ${leds}
    chipset: ${led_type}
    rgb_order: ${color_order}

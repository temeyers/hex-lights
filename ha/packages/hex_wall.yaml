script:
  hex_wall_desired_snapshot:
    alias: Hex wall - snapshot desired state from live tiles
    fields: {"only_missing": {"description": "only tiles with no record", "default": false, "selector": {"boolean": null}}}
    sequence:
      - variables:
          have: "{{ state_attr('sensor.hex_wall_desired', 'tiles') or {} }}"
          live: "{{ states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | select('has_value') | list }}"
          upd: "{% set ns = namespace(d={}) %}{% for l in live %}{% set k = l.split('.')[1][:-6] %} {% if not (only_missing | default(false)) or k not in have %} {% set ns.d = dict(ns.d, **{k: {'on': is_state(l, 'on'), 'brightness': state_attr(l, 'brightness') | int(76), 'rgb': (state_attr(l, 'rgb_color') or [255, 255, 255]) | list, 'mc': is_state('switch.' ~ k ~ '_manual_color', 'on')}}) %} {% endif %}{% endfor %}{{ ns.d }}"

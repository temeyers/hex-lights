          cur: "{{ states('input_text.hex_ota_pending').split(',') | reject('in', ['', 'unknown', 'unavailable']) | list }}"
      - action: input_text.set_value
        target: {entity_id: input_text.hex_ota_pending}
        data: {value: "{{ (cur + want) | unique | sort | join(',') }}"}
      - repeat:
          for_each: "{{ want | select('in', states('input_text.hex_ota_pending').split(',')) | list }}"
          sequence:
            - if: "{{ has_value('light.hex_' ~ repeat.item ~ '_light') }}"
              then:
                - action: script.hex_ota_install_one
                  data: {nn: "{{ repeat.item }}"}
                # one at a time: wait for this tile's result before the next
                - wait_for_trigger:
                    - trigger: event
                      event_type: hex_ota_result
                  timeout: {minutes: 20}
  hex_ota_install_one:
    alias: Hex OTA - install one tile (waits for any update in progress)
    fields: {"nn": {"description": "tile number", "example": "05"}}
    mode: queued
    sequence:
      # never interrupt an update: wait while any HA/add-on update entity is installing
      - wait_template: "{{ states.update | selectattr('attributes.in_progress', 'eq', true) | list | length == 0 }}"
        timeout: {minutes: 30}
      - action: shell_command.hex_ota_install
        data: {config: "hex-{{ nn }}.yaml"}
      - delay: {seconds: 20}
      - repeat:
          sequence:
            - delay: {seconds: 20}
            - action: shell_command.hex_ota_install
              data: {config: "--status hex-{{ nn }}.yaml"}
              response_variable: st
          until: "{{ st.stdout | trim in ['ok', 'failed', 'none'] or repeat.index > 90 }}"

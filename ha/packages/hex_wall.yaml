":0.6667,"angleU":0.5},{"e":"light.hex_15_light","id":"r2-h","x":0.1111,"y":0.75,"q":-2,"r":1,"ring":2,"angle":150.0,"i":14,"nn":"Hex 15","ringU":0.6667,"angleU":0.4167},{"e":"light.hex_16_light","id":"r2-i","x":0.2222,"y":1.0,"q":-2,"r":2,"ring":2,"angle":120.0,"i":15,"nn":"Hex 16","ringU":0.6667,"angleU":0.3333},{"e":"light.hex_17_light","id":"r2-j","x":0.4444,"y":1.0,"q":-1,"r":2,"ring":2,"angle":90.0,"i":16,"nn":"Hex 17","ringU":0.6667,"angleU":0.25},{"e":"light.hex_18_light","id":"r2-k","x":0.6667,"y":1.0,"q":0,"r":2,"ring":2,"angle":60.0,"i":17,"nn":"Hex 18","ringU":0.6667,"angleU":0.1667},{"e":"light.hex_19_light","id":"r2-l","x":0.7778,"y":0.75,"q":1,"r":1,"ring":2,"angle":30.0,"i":18,"nn":"Hex 19","ringU":0.6667,"angleU":0.0833},{"e":"light.hex_20_light","id":"r3-a","x":1.0,"y":0.25,"q":3,"r":-1,"ring":3,"angle":340.89,"i":19,"nn":"Hex 20","ringU":1.0,"angleU":0.9469}]
      c: "{{ color | default([40,120,255]) }}"
      sp: "{{ speed | default(2) | float }}"
      o: "{{ (tiles | selectattr('nn', 'eq', origin | default('Hex 01')) | list + [tiles[0]])[0] }}"
      dists: >-
        {%- set ns = namespace(d=[]) -%}
        {%- for tt in tiles -%}
        {%- set dq = tt.q - o.q -%}{%- set dr = tt.r - o.r -%}
        {%- set ns.d = ns.d + [((dq | abs) + (dr | abs) + ((dq + dr) | abs)) // 2] -%}
        {%- endfor -%}{{ ns.d }}
      period: "{{ ((dists | max) + 2) / sp }}"
    sequence:
      - {"action": "script.turn_off", "target": {"entity_id": ["script.hex_wall_solid", "script.hex_wall_breathe", "script.hex_wall_rainbow_sweep", "script.hex_wall_spiral", "script.hex_wall_sparkle"]}}
      - action: light.turn_on
        target: {entity_id: light.hex_wall}
        data: {rgb_color: "{{ c }}", brightness: 1}
      - repeat:
          while: "{{ is_state('input_select.hex_wall_effect', 'ripple') }}"
          sequence:
            - repeat:
                for_each: "{{ tiles }}"
                sequence:
                  - action: script.turn_on
                    target: {entity_id: script.hex_wall_tile_pulse}
                    data:
                      variables:
                        entity: "{{ repeat.item.e }}"
                        delay_ms: "{{ (dists[repeat.index - 1] / sp * 1000) | int }}"
                        color: "{{ c }}"
                        up_s: "{{ 1 / sp }}"
                        down_s: "{{ 1 / sp }}"
            - delay: {seconds: "{{ period }}"}
  hex_wall_sparkle:
    alias: Hex wall sparkle
    mode: restart
    fields: {"color": {"description": "sparkle colour", "example": "255, 255, 255", "default": [255, 255, 255], "selector": {"color_rgb": null}}, "density": {"description": "fraction of tiles lit per step", "example": "0.15", "default": 0.15, "selector": {"number": {"min": 0, "max": 1, "step": 0.01, "mode": "box"}}}, "step": {"description": "seconds per update", "example": "0.5", "default": 0.5, "selector": {"number": {"min": 0.1, "max": 10, "step": 0.1, "mode": "box", "unit_of_measurement": "s"}}}}
    variables:
      tiles: [{"e":"light.hex_01_light","id":"c0","x":0.4444,"y":0.5,"q":0,"r":0,"ring":0,"angle":0.0,"i":0,"nn":"Hex 01","ringU":0.0,"angleU":0.0},{"e":"light.hex_02_light","id":"r1-e","x":0.6667,"y":0.5,"q":1,"r":0,"ring":1,"angle":0.0,"i":1,"nn":"Hex 02","ringU":0.3333,"angleU":0.0},{"e":"light.hex_03_light","id":"r1-ne","x":0.5556,"y":0.25,"q":1,"r":-1,"ring":1,"angle":300.0,"i":2,"nn":"Hex 03","ringU":0.3333,"angleU":0.8333},{"e":"light.hex_04_light","id":"r1-nw","x":0.3333,"y":0.25,"q":0,"r":-1,"ring":1,"angle":240.0,"i":3,"nn":"Hex 04","ringU":0.3333,"angleU":0.6667},{"e":"light.hex_05_light","id":"r1-w","x":0.2222,"y":0.5,"q":-1,"r":0,"ring":1,"angle":180.0,"i":4,"nn":"Hex 05","ringU":0.3333,"angleU":0.5},{"e":"light.hex_06_light","id":"r1-sw","x":0.3333,"y":0.75,"q":-1,"r":1,"ring":1,"angle":120.0,"i":5,"nn":"Hex 06","ringU":0.3333,"angleU":0.3333},{"e":"light.hex_07_light","id":"r1-se","x":0.5556,"y":0.75,"q":0,"r":1,"ring":1,"angle":60.0,"i":6,"nn":"Hex 07","ringU":0.3333,"angleU":0.1667},{"e":"light.hex_08_light","id":"r2-a","x":0.8889,"y":0.5,"q":2,"r":0,"ring":2,"angle":0.0,"i":7,"nn":"Hex 08","ringU":0.6667,"angleU":0.0},{"e":"light.hex_09_light","id":"r2-b","x":0.7778,"y":0.25,"q":2,"r":-1,"ring":2,"angle":330.0,"i":8,"nn":"Hex 09","ringU":0.6667,"angleU":0.9167},{"e":"light.hex_10_light","id":"r2-c","x":0.6667,"y":0.0,"q":2,"r":-2,"ring":2,"angle":300.0,"i":9,"nn":"Hex 10","ringU":0.6667,"angleU":0.8333},{"e":"light.hex_11_light","id":"r2-d","x":0.4444,"y":0.0,"q":1,"r":-2,"ring":2,"angle":270.0,"i":10,"nn":"Hex 11","ringU":0.6667,"angleU":0.75},{"e":"light.hex_12_light","id":"r2-e","x":0.2222,"y":0.0,"q":0,"r":-2,"ring":2,"angle":240.0,"i":11,"nn":"Hex 12","ringU":0.6667,"angleU":0.6667},{"e":"light.hex_13_light","id":"r2-f","x":0.1111,"y":0.25,"q":-1,"r":-1,"ring":2,"angle":210.0,"i":12,"nn":"Hex 13","ringU":0.6667,"angleU":0.5833},{"e":"light.hex_14_light","id":"r2-g","x":0.0,"y":0.5,"q":-2,"r":0,"ring":2,"angle":180.0,"i":13,"nn":"Hex 14","ringU":0.6667,"angleU":0.5},{"e":"light.hex_15_light","id":"r2-h","x":0.1111,"y":0.75,"q":-2,"r":1,"ring":2,"angle":150.0,"i":14,"nn":"Hex 15","ringU":0.6667,"angleU":0.4167},{"e":"light.hex_16_light","id":"r2-i","x":0.2222,"y":1.0,"q":-2,"r":2,"ring":2,"angle":120.0,"i":15,"nn":"Hex 16","ringU":0.6667,"angleU":0.3333},{"e":"light.hex_17_light","id":"r2-j","x":0.4444,"y":1.0,"q":-1,"r":2,"ring":2,"angle":90.0,"i":16,"nn":"Hex 17","ringU":0.6667,"angleU":0.25},{"e":"light.hex_18_light","id":"r2-k","x":0.6667,"y":1.0,"q":0,"r":2,"ring":2,"angle":60.0,"i":17,"nn":"Hex 18","ringU":0.6667,"angleU":0.1667},{"e":"light.hex_19_light","id":"r2-l","x":0.7778,"y":0.75,"q":1,"r":1,"ring":2,"angle":30.0,"i":18,"nn":"Hex 19","ringU":0.6667,"angleU":0.0833},{"e":"light.hex_20_light","id":"r3-a","x":1.0,"y":0.25,"q":3,"r":-1,"ring":3,"angle":340.89,"i":19,"nn":"Hex 20","ringU":1.0,"angleU":0.9469}]
      c: "{{ color | default([255,255,255]) }}"
      dens: "{{ density | default(0.15) | float }}"
      dt: "{{ step | default(0.5) | float }}"
    sequence:
      - {"action": "script.turn_off", "target": {"entity_id": ["script.hex_wall_solid", "script.hex_wall_breathe", "script.hex_wall_rainbow_sweep", "script.hex_wall_ripple", "script.hex_wall_spiral"]}}
      - repeat:
          while: "{{ is_state('input_select.hex_wall_effect', 'sparkle') }}"
          sequence:
            - repeat:
                for_each: "{{ tiles }}"
                sequence:
                  - action: light.turn_on
                    target: {entity_id: "{{ repeat.item.e }}"}
                    data:
                      rgb_color: "{{ c }}"
                      transition: "{{ dt / 2 }}"
                      brightness: "{{ 255 if range(1000) | random < dens * 1000 else 1 }}"
            - delay: {seconds: "{{ dt }}"}
  hex_wall_max_brightness_apply:
    alias: Hex wall push max brightness to tiles
    variables:
      targets: "{{ (states.number | map(attribute='entity_id') | select('match', '^number[.]hex_[0-9]+_max_brightness$') | sort | select('has_value') | list) }}"
      v: "{{ states('input_number.hex_wall_max_brightness') | int(100) }}"
    sequence:
      - repeat:
          for_each: "{{ targets | select('has_value') | list }}"
          sequence:
            - action: number.set_value
              continue_on_error: true
              target: {entity_id: "{{ repeat.item }}"}
              data: {value: "{{ v }}"}
  hex_wall_current_limit_apply:
    alias: Hex wall push current limit to tiles
    variables:
      targets: "{{ (states.switch | map(attribute='entity_id') | select('match', '^switch[.]hex_[0-9]+_current_limit$') | sort | select('has_value') | list) }}"
    sequence:
      - variables:
          live: "{{ targets | select('has_value') | list }}"
      - if: "{{ live | length > 0 }}"
        then:
          - if: "{{ is_state('input_boolean.hex_wall_current_limit', 'on') }}"
            then:
              - action: switch.turn_on
                target: {entity_id: "{{ live }}"}
            else:
              - action: switch.turn_off
                target: {entity_id: "{{ live }}"}
  hex_target_white:
    alias: Hex target - white shade (emulated colour temperature on RGB LEDs)
    mode: queued
    fields:
      kelvin: {description: "2000-6500 K (warm 2700, neutral 4000, cool 6500)", example: 4000}
    sequence:
      - action: number.set_value
        target: {entity_id: "{% set t = states('input_select.hex_wall_target') %}{{ ['number.hex_' ~ t[4:] ~ '_white_temperature'] if t[:4] == 'Hex ' else states.number | map(attribute='entity_id') | select('match', '^number[.]hex_[0-9]+_white_temperature$') | select('has_value') | list }}"}
        data: {value: "{{ [2000, [6500, kelvin | int(4000)] | min] | max }}"}
  hex_wall_manual_color_apply:
    alias: Hex wall manual colour (every live tile's switch)
    variables:
      targets: "{{ (states.switch | map(attribute='entity_id') | select('match', '^switch[.]hex_[0-9]+_manual_color$') | sort | select('has_value') | list) }}"
    sequence:
      - variables:
          live: "{{ targets | select('has_value') | list }}"
      - if: "{{ live | length > 0 }}"
        then:
          - if: "{{ is_state('input_boolean.hex_wall_manual_color', 'on') }}"
            then:
              - action: switch.turn_on
                target: {entity_id: "{{ live }}"}
            else:
              - action: switch.turn_off
                target: {entity_id: "{{ live }}"}
  hex_wall_sync_mode_apply_layout:
    alias: Hex wall set sync mode from layout.json (Wireless (ESP-NOW))
    sequence:
      - action: select.select_option
        target: {entity_id: select.hex_01_sync_mode}
        data: {option: "Wireless (ESP-NOW)"}
  hex_wall_fx_apply:
    alias: Hex wall apply synced effect
    mode: restart
    variables:
      fx_ids: {"solid": 0, "radial_wave": 1, "rainbow_sweep": 2, "pulse": 3, "chase": 4, "wipe": 5, "rainbow_flow": 6, "random_ripple": 7, "twinkle": 8, "color_cycle": 9, "snake": 10}
      pal_ids: {"rainbow": 0, "ocean": 1, "sunset": 2, "forest": 3, "fire": 4, "mono": 5}
      fx: "{{ states('input_select.hex_wall_fx') }}"
      tgt_nodes: "{% set t = states('input_select.hex_wall_target') %}{% if t[:4] == 'Hex ' %}{{ ['hex_' ~ t[4:]] }}{% else %}{{ (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) | map('replace', 'light.', '') | map('replace', '_light', '') | list }}{% endif %}"
      tgt_light: "{% set t = states('input_select.hex_wall_target') %}{{ ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) }}"
    sequence:
      - if: "{{ fx == 'off' }}"
        then:
          - action: light.turn_off
            target: {entity_id: "{{ tgt_light }}"}
          - stop: "off"
      # Target 'All': every flashed tile gets the same params + start time (followers also take them from the
      # leader's hexsync beacons when ESP-NOW links); 'Hex NN': that tile only.
      - repeat:
          for_each: "{{ tgt_nodes }}"
          sequence:
            - action: "esphome.{{ repeat.item }}_set_wall_fx"
              continue_on_error: true
              data:
                effect: "{{ fx_ids[fx] }}"
                palette: "{{ pal_ids[states('input_select.hex_wall_palette')] }}"
                speed: "{{ [[(states('input_number.hex_wall_speed') | float(1) * 1000) | int, 0] | max, 10000] | min }}"
                scale: 100
                hue: 18
                saturation: 215
                value: 255
                start_delay_ms: 300
                axis: "{{ {'x': 0, 'y': 1, 'ring': 2, 'angle': 3}.get(states('input_select.hex_wall_axis'), 0) }}"
      - action: light.turn_on
        target: {entity_id: "{{ tgt_light }}"}
        data: {effect: HexSync}
  hex_wall_led_count_apply:
    alias: Hex wall push LED count to tiles
    variables:
      targets: "{{ (states.number | map(attribute='entity_id') | select('match', '^number[.]hex_[0-9]+_led_count$') | sort | select('has_value') | list) }}"
      overrides: {"number.hex_20_led_count": 42}
      n: "{{ states('input_number.hex_wall_led_count') | int(44) }}"
    sequence:
      - repeat:
          for_each: "{{ targets | select('has_value') | list }}"
          sequence:
            - action: number.set_value
              target: {entity_id: "{{ repeat.item }}"}
              data: {value: "{{ overrides.get(repeat.item, n) }}"}
# ---- Whole-wall (HexSync v2) effects. Interface names: tools/gen_ha.py INTERFACE.
input_select:
  hex_wall_target:
    name: Hex target
    icon: mdi:hexagon-multiple-outline
    options: ["All"]   # seed only; hex_wall_target_options adds 'Hex NN' for every light.hex_NN_light
  hex_wall_fx:
    name: Hex wall synced effect
    options: ["off", "solid", "radial_wave", "rainbow_sweep", "pulse", "chase", "wipe", "rainbow_flow", "random_ripple", "twinkle", "color_cycle", "snake"]
    initial: "off"
  hex_wall_palette:
    name: Hex wall palette
    options: ["rainbow", "ocean", "sunset", "forest", "fire", "mono"]
    initial: rainbow
  hex_wall_axis:
    name: Hex wall wipe/sweep axis
    options: ["x", "y", "ring", "angle"]
    initial: x
input_number:
  hex_wall_speed:
    name: Hex wall speed
    min: 0
    max: 10
    step: 0.05
    initial: 1
    mode: slider
  hex_wall_max_brightness:
    name: Hex wall max brightness
    min: 0
    max: 100
    step: 1
    initial: 100
    unit_of_measurement: "%"
    mode: slider
  hex_wall_led_count:
    name: Hex wall LEDs per tile
    min: 1
    max: 60
    step: 1
    initial: 44
    mode: box
automation:
  - id: hex_wall_target_options
    alias: Hex wall - target list = All + flashed tiles
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: entity_registry_updated
      - trigger: event
        event_type: automation_reloaded
      - trigger: time_pattern
        minutes: "/1"
    variables:
      want: "{{ ['All'] + ((states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | list) | map('replace', 'light.hex_', 'Hex ') | map('replace', '_light', '') | list) }}"
    conditions:
      - "{{ state_attr('input_select.hex_wall_target', 'options') != want }}"
    actions:
      - variables:
          cur: "{{ states('input_select.hex_wall_target') }}"
      - action: input_select.set_options
        target: {entity_id: input_select.hex_wall_target}
        data: {options: "{{ want }}"}
      - if: "{{ cur in want }}"
        then:
          - action: input_select.select_option
            target: {entity_id: input_select.hex_wall_target}
            data: {option: "{{ cur }}"}
  - id: hex_wall_target_changed
    alias: Hex wall - panel follows the selected target
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.hex_wall_target
    variables:
      fx_sel: "{% set t = states('input_select.hex_wall_target') %}{% set e = 'select.hex_' ~ t[4:] ~ '_wall_effect' if t[:4] == 'Hex ' else '' %}{{ e if e and has_value(e) else 'select.hex_01_wall_effect' }}"
      pal_sel: "{% set t = states('input_select.hex_wall_target') %}{% set e = 'select.hex_' ~ t[4:] ~ '_wall_palette' if t[:4] == 'Hex ' else '' %}{{ e if e and has_value(e) else 'select.hex_01_wall_palette' }}"
      axis_sel: "{% set t = states('input_select.hex_wall_target') %}{% set e = 'select.hex_' ~ t[4:] ~ '_wall_wipe_axis' if t[:4] == 'Hex ' else '' %}{{ e if e and has_value(e) else 'select.hex_01_wall_wipe_axis' }}"
      speed_num: "number.hex_01_wall_speed"
    actions:
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.hex_wall_syncing}
      - if: "{{ states(fx_sel) in state_attr('input_select.hex_wall_fx', 'options') }}"
        then:
          - action: input_select.select_option
            target: {entity_id: input_select.hex_wall_fx}
            data: {option: "{{ states(fx_sel) }}"}
      - if: "{{ states(pal_sel) in state_attr('input_select.hex_wall_palette', 'options') }}"
        then:
          - action: input_select.select_option
            target: {entity_id: input_select.hex_wall_palette}
            data: {option: "{{ states(pal_sel) }}"}
      - if: "{{ states(axis_sel) in state_attr('input_select.hex_wall_axis', 'options') }}"
        then:
          - action: input_select.select_option
            target: {entity_id: input_select.hex_wall_axis}
            data: {option: "{{ states(axis_sel) }}"}
      - if: "{{ has_value(speed_num) }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.hex_wall_speed}
            data: {value: "{{ (states(speed_num) | float(1000) / 1000) | round(2) }}"}
      - delay: {milliseconds: 800}
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.hex_wall_syncing}
      # 'All' means every tile: if the wall is on but some tiles are off (e.g. one was switched off on its own),
      # bring those up with the colour/brightness of the first lit tile so the whole wall answers the panel.
      - if: "{{ trigger.to_state.state == 'All' }}"
        then:
          - variables:
              lights: "{{ (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) }}"
              lit: "{{ lights | select('is_state', 'on') | list }}"
              dark: "{{ lights | reject('is_state', 'on') | list }}"
          - if: "{{ lit | length > 0 and dark | length > 0 }}"
            then:
              - action: light.turn_on
                target: {entity_id: "{{ dark }}"}
                data:
                  brightness: "{{ state_attr(lit[0], 'brightness') | int(76) }}"
                  rgb_color: "{{ state_attr(lit[0], 'rgb_color') or [255, 255, 255] }}"
  - id: hex_wall_fx_changed
    alias: Hex wall - synced effect / palette / speed changed
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_select.hex_wall_fx, input_select.hex_wall_palette, input_select.hex_wall_axis, input_number.hex_wall_speed]
    conditions:
      - condition: state
        entity_id: input_boolean.hex_wall_syncing
        state: "off"
    actions:
      - delay: {milliseconds: 300}
      - action: script.hex_wall_fx_apply
  - id: hex_wall_led_count_changed
    alias: Hex wall - LED count changed
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.hex_wall_led_count
    actions:
      - delay: {seconds: 1}
      - action: script.hex_wall_led_count_apply
  - id: hex_wall_sync_jumper_lost
    alias: Hex wall - jumper sync lost
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: ["sensor.hex_01_sync_source", "sensor.hex_02_sync_source", "sensor.hex_03_sync_source", "sensor.hex_04_sync_source", "sensor.hex_05_sync_source", "sensor.hex_06_sync_source", "sensor.hex_07_sync_source", "sensor.hex_08_sync_source", "sensor.hex_09_sync_source", "sensor.hex_10_sync_source", "sensor.hex_11_sync_source", "sensor.hex_12_sync_source", "sensor.hex_13_sync_source", "sensor.hex_14_sync_source", "sensor.hex_15_sync_source", "sensor.hex_16_sync_source", "sensor.hex_17_sync_source", "sensor.hex_18_sync_source", "sensor.hex_19_sync_source", "sensor.hex_20_sync_source"]
        to: "jumper-lost"
        for: {seconds: 15}
    conditions:
      - condition: state
        entity_id: select.hex_01_sync_mode
        state: "Jumper wire"
    actions:
      - action: notify.notify
        data:
          title: Hex wall sync
          message: >-
            {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }} lost the
            jumper-wire sync pulse (falling back to the ESP-NOW clock). Check the GPIO12 wire.
      - delay: {minutes: 10}
  - id: hex_wall_manual_color_changed
    alias: Hex wall - manual colour changed
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.hex_wall_manual_color
    actions:
      - action: script.hex_wall_manual_color_apply
  - id: hex_wall_max_brightness_changed
    alias: Hex wall - max brightness changed
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.hex_wall_max_brightness
    actions:
      - delay: {seconds: 1}
      - action: script.hex_wall_max_brightness_apply
  - id: hex_wall_current_limit_changed
    alias: Hex wall - current limit changed
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.hex_wall_current_limit
    actions:
      - action: script.hex_wall_current_limit_apply
  # ---- HA is the source of truth for every Hex. Desired state per tile lives in sensor.hex_wall_desired
  # (attribute tiles: {hex_NN: {on, brightness, rgb, mc}}; attribute hold: {hex_NN: epoch} = ignore the tile
  # until then). A freshly booted / reconnected tile never writes its restored state into HA.
  - id: hex_wall_desired_record
    alias: Hex wall - record desired state (HA changes only)
    mode: queued
    max: 50
    triggers:
      - trigger: state
        entity_id: [light.hex_01_light, light.hex_02_light, light.hex_03_light, light.hex_04_light, light.hex_05_light, light.hex_06_light, light.hex_07_light, light.hex_08_light, light.hex_09_light, light.hex_10_light, light.hex_11_light, light.hex_12_light, light.hex_13_light, light.hex_14_light, light.hex_15_light, light.hex_16_light, light.hex_17_light, light.hex_18_light, light.hex_19_light, light.hex_20_light]
      - trigger: state
        entity_id: [switch.hex_01_manual_color, switch.hex_02_manual_color, switch.hex_03_manual_color, switch.hex_04_manual_color, switch.hex_05_manual_color, switch.hex_06_manual_color, switch.hex_07_manual_color, switch.hex_08_manual_color, switch.hex_09_manual_color, switch.hex_10_manual_color, switch.hex_11_manual_color, switch.hex_12_manual_color, switch.hex_13_manual_color, switch.hex_14_manual_color, switch.hex_15_manual_color, switch.hex_16_manual_color, switch.hex_17_manual_color, switch.hex_18_manual_color, switch.hex_19_manual_color, switch.hex_20_manual_color]
    variables:
      key: "{{ trigger.entity_id.split('.')[1] | regex_replace('_(light|manual_color)$', '') }}"
      held: "{{ (state_attr('sensor.hex_wall_desired', 'hold') or {}).get(key, 0) | float(0) > as_timestamp(now()) }}"
    conditions:
      - "{{ trigger.from_state is not none and trigger.to_state is not none }}"
      - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] and trigger.to_state.state not in ['unavailable', 'unknown'] }}"
      # Only changes HA asked for (a user, or an automation/script: context has user_id or parent_id). A tile's own
      # pushes (boot/flash restore, reconnect) carry a bare context and are never recorded. No time window, so an HA
      # change right after a reconnect is kept (the old 25 s hold dropped one: hex_04 at 9:17 PM CT).
      - "{{ trigger.to_state.context.user_id is not none or trigger.to_state.context.parent_id is not none }}"
    actions:
      - variables:
          l: "light.{{ key }}_light"
          rec:
            "on": "{{ is_state(l, 'on') }}"
            brightness: "{{ state_attr(l, 'brightness') | int(0) if is_state(l, 'on') else ((state_attr('sensor.hex_wall_desired', 'tiles') or {}).get(key, {}).get('brightness', 76)) }}"
            rgb: "{{ (state_attr(l, 'rgb_color') | list) if state_attr(l, 'rgb_color') else ((state_attr('sensor.hex_wall_desired', 'tiles') or {}).get(key, {}).get('rgb', [255, 255, 255])) }}"
            mc: "{{ is_state('switch.' ~ key ~ '_manual_color', 'on') }}"
          # Target 'All': tiles that are offline right now missed this wall change, so they get it too.
          offline: "{{ (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | reject('has_value') | map('replace', 'light.', '') | map('replace', '_light', '') | list) if is_state('input_select.hex_wall_target', 'All') else [] }}"
          upd: "{% set ns = namespace(d={key: rec}) %}{% for k in offline %}{% set ns.d = dict(ns.d, **{k: rec}) %}{% endfor %}{{ ns.d }}"
      - event: hex_desired_set
        event_data: {tiles: "{{ upd }}"}
  - id: hex_wall_resync_on_reconnect
    alias: Hex wall - reconnecting tile adopts HA's current state
    mode: parallel
    max: 20
    triggers:
      - trigger: state
        entity_id: [light.hex_01_light, light.hex_02_light, light.hex_03_light, light.hex_04_light, light.hex_05_light, light.hex_06_light, light.hex_07_light, light.hex_08_light, light.hex_09_light, light.hex_10_light, light.hex_11_light, light.hex_12_light, light.hex_13_light, light.hex_14_light, light.hex_15_light, light.hex_16_light, light.hex_17_light, light.hex_18_light, light.hex_19_light, light.hex_20_light]
        from: ["unavailable", "unknown"]
    conditions:
      - "{{ trigger.to_state.state in ['on', 'off'] }}"
    variables:
      key: "{{ trigger.entity_id.split('.')[1] | regex_replace('_light$', '') }}"
      l: "{{ trigger.entity_id }}"
    actions:
      - event: hex_desired_set
        event_data: {hold: "{{ {key: as_timestamp(now()) + 25} }}"}
      - repeat:
          count: 2   # once after the API settles, once more in case a late flash-restore lands after it
          sequence:
            - delay: {seconds: "{{ 4 if repeat.index == 1 else 15 }}"}
            - variables:
                d: "{{ (state_attr('sensor.hex_wall_desired', 'tiles') or {}).get(key) }}"
                fx: "{{ states('input_select.hex_wall_fx') }}"
            - if: "{{ d and has_value(l) }}"
              then:
                - if: "{{ d.on }}"
                  then:
                    - action: light.turn_on
                      target: {entity_id: "{{ l }}"}
                      data: {brightness: "{{ d.brightness | int(76) }}", rgb_color: "{{ d.rgb }}"}
                  else:
                    - action: light.turn_off
                      target: {entity_id: "{{ l }}"}
                - if: "{{ has_value('switch.' ~ key ~ '_manual_color') }}"
                  then:
                    - action: "switch.turn_{{ 'on' if d.mc else 'off' }}"
                      target: {entity_id: "switch.{{ key }}_manual_color"}
            - if: "{{ fx in ['solid', 'radial_wave', 'rainbow_sweep', 'pulse', 'chase', 'wipe', 'rainbow_flow', 'random_ripple', 'twinkle', 'color_cycle', 'snake'] and has_value(l) }}"
              then:
                - action: "esphome.{{ key }}_set_wall_fx"
                  continue_on_error: true
                  data:
                    effect: "{{ {'solid': 0, 'radial_wave': 1, 'rainbow_sweep': 2, 'pulse': 3, 'chase': 4, 'wipe': 5, 'rainbow_flow': 6, 'random_ripple': 7, 'twinkle': 8, 'color_cycle': 9, 'snake': 10}[fx] }}"
                    palette: "{{ {'rainbow': 0, 'ocean': 1, 'sunset': 2, 'forest': 3, 'fire': 4, 'mono': 5}.get(states('input_select.hex_wall_palette'), 0) }}"
                    speed: "{{ [[(states('input_number.hex_wall_speed') | float(1) * 1000) | int, 0] | max, 10000] | min }}"
                    scale: 100
                    hue: 18
                    saturation: 215
                    value: 255
                    start_delay_ms: 300
                    axis: "{{ {'x': 0, 'y': 1, 'ring': 2, 'angle': 3}.get(states('input_select.hex_wall_axis'), 0) }}"
  - id: hex_wall_desired_seed
    alias: Hex wall - seed desired state for live tiles that have none
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    actions:
      - delay: {seconds: 30}
      - action: script.hex_wall_desired_snapshot
        data: {only_missing: true}
  # ---- Pending firmware: input_text.hex_ota_pending = comma list of 'NN'. Any change of firmware: run
  # script.hex_ota_queue (default: every flashed Hex). Online ones install one at a time now; offline ones
  # install automatically when they come back. Results arrive as event hex_ota_result.
  - id: hex_ota_on_reconnect
    alias: Hex OTA - install pending firmware when a Hex comes back
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: [light.hex_01_light, light.hex_02_light, light.hex_03_light, light.hex_04_light, light.hex_05_light, light.hex_06_light, light.hex_07_light, light.hex_08_light, light.hex_09_light, light.hex_10_light, light.hex_11_light, light.hex_12_light, light.hex_13_light, light.hex_14_light, light.hex_15_light, light.hex_16_light, light.hex_17_light, light.hex_18_light, light.hex_19_light, light.hex_20_light]
        from: ["unavailable", "unknown"]
        for: {seconds: 30}
    variables:
      nn: "{{ trigger.entity_id[10:12] }}"
    conditions:
      - "{{ nn in states('input_text.hex_ota_pending').split(',') }}"
    actions:
      - action: script.hex_ota_install_one
        data: {nn: "{{ nn }}"}
  - id: hex_ota_result
    alias: Hex OTA - result (clear pending + notify)
    mode: queued
    triggers:
      - trigger: event
        event_type: hex_ota_result
    variables:
      nn: "{{ trigger.event.data.configuration[4:6] }}"
    actions:
      - if: "{{ trigger.event.data.ok }}"
        then:
          - action: input_text.set_value
            target: {entity_id: input_text.hex_ota_pending}
            data: {value: "{{ states('input_text.hex_ota_pending').split(',') | reject('in', [nn, '', 'unknown', 'unavailable']) | join(',') }}"}
      - action: notify.mobile_app_terrys_iphone
        data:
          title: "Hex {{ nn }} firmware"
          message: >-
            {{ 'Hex ' ~ nn ~ ' came back online and got the pending firmware update.' if trigger.event.data.ok
               else 'Hex ' ~ nn ~ ' firmware update failed (code ' ~ trigger.event.data.code ~ '); it stays pending.' }}
group:
  hex_wall_displayed_colors:
    name: Hex wall displayed colours
    entities: ["sensor.hex_01_displayed_color", "sensor.hex_02_displayed_color", "sensor.hex_03_displayed_color", "sensor.hex_04_displayed_color", "sensor.hex_05_displayed_color", "sensor.hex_06_displayed_color", "sensor.hex_07_displayed_color", "sensor.hex_08_displayed_color", "sensor.hex_09_displayed_color", "sensor.hex_10_displayed_color", "sensor.hex_11_displayed_color", "sensor.hex_12_displayed_color", "sensor.hex_13_displayed_color", "sensor.hex_14_displayed_color", "sensor.hex_15_displayed_color", "sensor.hex_16_displayed_color", "sensor.hex_17_displayed_color", "sensor.hex_18_displayed_color", "sensor.hex_19_displayed_color", "sensor.hex_20_displayed_color"]
input_text:
  hex_ota_pending:
    name: Hex OTA pending (tile numbers)
    max: 255
shell_command:
  hex_ota_install: "python3 /config/python_scripts_hex_ota_install.py {{ config }}"
input_boolean:
  hex_wall_current_limit:
    name: Hex wall current limit (1200 mA per tile)
    initial: false
  hex_wall_manual_color:
    name: Hex wall manual colour (tiles show the light colour; effects off)
    initial: false
  hex_wall_syncing:
    name: Hex wall panel syncing (internal)
    initial: false
template:
  - light:
      - name: Hex target
        unique_id: hex_target_light
        icon: mdi:hexagon-multiple
        state: "{% set t = states('input_select.hex_wall_target') %}{% set l = ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) %}{% set on = l | select('is_state', 'on') | list %}{{ on | length > 0 }}"
        level: "{% set t = states('input_select.hex_wall_target') %}{% set l = ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) %}{% set on = l | select('is_state', 'on') | list %}{{ on | map('state_attr', 'brightness') | map('int', 0) | max | default(0) }}"
        rgb: "{% set t = states('input_select.hex_wall_target') %}{% set l = ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) %}{% set on = l | select('is_state', 'on') | list %}{{ (on + l) | map('state_attr', 'rgb_color') | reject('none') | first | default((255, 255, 255)) }}"
        turn_on:
          - action: light.turn_on
            target: {entity_id: "{% set t = states('input_select.hex_wall_target') %}{{ ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) }}"}
        turn_off:
          - action: light.turn_off
            target: {entity_id: "{% set t = states('input_select.hex_wall_target') %}{{ ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) }}"}
        set_level:
          - action: light.turn_on
            target: {entity_id: "{% set t = states('input_select.hex_wall_target') %}{{ ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) }}"}
            data: {brightness: "{{ brightness }}"}
        set_rgb:
          - action: light.turn_on
            target: {entity_id: "{% set t = states('input_select.hex_wall_target') %}{{ ['light.hex_' ~ t[4:] ~ '_light'] if t[:4] == 'Hex ' else (states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | sort | select('has_value') | list) }}"}
            data: {rgb_color: ["{{ r }}", "{{ g }}", "{{ b }}"]}
        temperature: "{% set t = states('input_select.hex_wall_target') %}{% set e = 'number.hex_' ~ t[4:] ~ '_white_temperature' if t[:4] == 'Hex ' else 'number.hex_01_white_temperature' %}{{ (1000000 / (states(e) | float(4000))) | round(0) | int }}"
        min_mireds: 153
        max_mireds: 500
        set_temperature:
          - action: script.hex_target_white
            data: {kelvin: "{{ (1000000 / color_temp) | round(-2) | int }}"}
  - switch:
      - name: Hex target manual color
        unique_id: hex_target_manual_color
        icon: mdi:palette
        # All: on when any live tile's switch is on (the master may be off/unavailable); Hex NN: that tile.
        state: "{% set t = states('input_select.hex_wall_target') %}{% set l = ['switch.hex_' ~ t[4:] ~ '_manual_color'] if t[:4] == 'Hex ' else states.switch | map(attribute='entity_id') | select('match', '^switch[.]hex_[0-9]+_manual_color$') | select('has_value') | list %}{{ l | select('is_state', 'on') | list | length > 0 }}"
        turn_on:
          - action: switch.turn_on
            target: {entity_id: "{% set t = states('input_select.hex_wall_target') %}{{ ['switch.hex_' ~ t[4:] ~ '_manual_color'] if t[:4] == 'Hex ' else states.switch | map(attribute='entity_id') | select('match', '^switch[.]hex_[0-9]+_manual_color$') | select('has_value') | list }}"}
        turn_off:
          - action: switch.turn_off
            target: {entity_id: "{% set t = states('input_select.hex_wall_target') %}{{ ['switch.hex_' ~ t[4:] ~ '_manual_color'] if t[:4] == 'Hex ' else states.switch | map(attribute='entity_id') | select('match', '^switch[.]hex_[0-9]+_manual_color$') | select('has_value') | list }}"}
  - triggers:
      - trigger: event
        event_type: hex_desired_set
    sensor:
      - name: Hex wall desired
        unique_id: hex_wall_desired
        icon: mdi:hexagon-multiple
        state: "{{ (dict((this.attributes.tiles or {}) if this.attributes is defined else {}, **(trigger.event.data.tiles if trigger.event.data.tiles is mapping else {}))) | count }}"
        attributes:
          tiles: "{{ dict((this.attributes.get('tiles') or {}) if this.attributes is defined else {}, **(trigger.event.data.tiles if trigger.event.data.tiles is mapping else {})) }}"
          hold: "{{ dict((this.attributes.get('hold') or {}) if this.attributes is defined else {}, **(trigger.event.data.hold if trigger.event.data.hold is mapping else {})) }}"

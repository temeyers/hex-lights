        event_data: {tiles: "{{ upd }}"}
  hex_ota_queue:
    alias: Hex OTA - queue firmware for tiles (online now, offline on reconnect)
    fields: {"tiles": {"description": "list of NN; default every flashed Hex", "example": "['01','05']", "selector": {"object": null}}}
    mode: queued
    sequence:
      - variables:
          all_nn: "{{ states.light | map(attribute='entity_id') | select('match', '^light[.]hex_[0-9]+_light$') | map('regex_replace', '^light[.]hex_([0-9]+)_light$', '\\\\1') | list }}"

":0.2222,"y":1.0,"q":-2,"r":2,"ring":2,"angle":120.0,"i":15,"ringU":0.6667,"angleU":0.3333},{"e":"light.hex_17_light","id":"r2-j","x":0.4444,"y":1.0,"q":-1,"r":2,"ring":2,"angle":90.0,"i":16,"ringU":0.6667,"angleU":0.25},{"e":"light.hex_18_light","id":"r2-k","x":0.6667,"y":1.0,"q":0,"r":2,"ring":2,"angle":60.0,"i":17,"ringU":0.6667,"angleU":0.1667},{"e":"light.hex_19_light","id":"r2-l","x":0.7778,"y":0.75,"q":1,"r":1,"ring":2,"angle":30.0,"i":18,"ringU":0.6667,"angleU":0.0833},{"e":"light.hex_20_light","id":"r3-a","x":1.0,"y":0.25,"q":3,"r":-1,"ring":3,"angle":340.89,"i":19,"ringU":1.0,"angleU":0.9469}]
      c: "{{ color | default([255,255,255]) }}"
      dens: "{{ density | default(0.15) | float }}"
      dt: "{{ step | default(0.5) | float }}"
    sequence:
      - {"action": "script.turn_off", "target": {"entity_id": ["script.hex_wall_solid", "script.hex_wall_breathe", "script.hex_wall_rainbow_sweep", "script.hex_wall_ripple", "script.hex_wall_spiral"]}}
      - repeat:
          while: "{{ is_state('input_select.hex_wall_effect', 'sparkle') }}"
          sequence:
            - repeat:
                for_each: "{{ tiles }}"
                sequence:
                  - action: light.turn_on
                    target: {entity_id: "{{ repeat.item.e }}"}
                    data:
                      rgb_color: "{{ c }}"
                      transition: "{{ dt / 2 }}"
                      brightness: "{{ 255 if range(1000) | random < dens * 1000 else 1 }}"
            - delay: {seconds: "{{ dt }}"}
  hex_wall_sync_mode_apply_layout:
    alias: Hex wall set sync mode from layout.json (Wireless (ESP-NOW))
    sequence:
      - action: select.select_option
        target: {entity_id: select.hex_01_sync_mode}
        data: {option: "Wireless (ESP-NOW)"}
  hex_wall_fx_apply:
    alias: Hex wall apply synced effect
    mode: restart
    variables:
      fx_ids: {"solid": 0, "ripple": 1, "rainbow_sweep": 2, "breathe": 3, "chase": 4, "wipe": 5, "rainbow_flow": 6, "random_ripple": 7, "twinkle": 8, "color_cycle": 9, "snake": 10}
      pal_ids: {"rainbow": 0, "ocean": 1, "sunset": 2, "forest": 3, "fire": 4, "mono": 5}
      fx: "{{ states('input_select.hex_wall_fx') }}"
    sequence:
      - if: "{{ fx == 'off' }}"
        then:
          - action: light.turn_off
            target: {entity_id: light.hex_wall}
          - stop: "off"
      - action: esphome.hex_01_set_wall_fx
        continue_on_error: true
        data:
          effect: "{{ fx_ids[fx] }}"
          palette: "{{ pal_ids[states('input_select.hex_wall_palette')] }}"
          speed: "{{ [[(states('input_number.hex_wall_speed') | float(1) * 1000) | int, 0] | max, 10000] | min }}"
          scale: 100
          hue: 18
          saturation: 215
          value: 255
          start_delay_ms: 300
      - if: "{{ has_value('select.hex_01_wall_wipe_axis') }}"
        then:
          - action: select.select_option
            continue_on_error: true
            target: {entity_id: select.hex_01_wall_wipe_axis}
            data: {option: "{{ states('input_select.hex_wall_axis') }}"}
      - action: light.turn_on
        target: {entity_id: light.hex_wall}
        data: {effect: HexSync}
  hex_wall_led_count_apply:
    alias: Hex wall push LED count to tiles
    variables:
      targets: ["number.hex_01_led_count", "number.hex_02_led_count", "number.hex_03_led_count", "number.hex_04_led_count", "number.hex_05_led_count", "number.hex_06_led_count", "number.hex_07_led_count", "number.hex_08_led_count", "number.hex_09_led_count", "number.hex_10_led_count", "number.hex_11_led_count", "number.hex_12_led_count", "number.hex_13_led_count", "number.hex_14_led_count", "number.hex_15_led_count", "number.hex_16_led_count", "number.hex_17_led_count", "number.hex_18_led_count", "number.hex_19_led_count", "number.hex_20_led_count"]
      overrides: {"number.hex_20_led_count": 42}
      n: "{{ states('input_number.hex_wall_led_count') | int(44) }}"
    sequence:
      - repeat:
          for_each: "{{ targets | select('has_value') | list }}"
          sequence:
            - action: number.set_value
              target: {entity_id: "{{ repeat.item }}"}
              data: {value: "{{ overrides.get(repeat.item, n) }}"}
# ---- Whole-wall (HexSync v2) effects. Interface names: tools/gen_ha.py INTERFACE.
input_select:
  hex_wall_fx:
    name: Hex wall synced effect
    options: ["off", "solid", "ripple", "rainbow_sweep", "breathe", "chase", "wipe", "rainbow_flow", "random_ripple", "twinkle", "color_cycle", "snake"]
    initial: "off"
  hex_wall_palette:
    name: Hex wall palette
    options: ["rainbow", "ocean", "sunset", "forest", "fire", "mono"]
    initial: rainbow
  hex_wall_axis:
    name: Hex wall wipe/sweep axis
    options: ["x", "y", "ring", "angle"]
    initial: x
input_number:
  hex_wall_speed:
    name: Hex wall speed
    min: 0
    max: 10
    step: 0.05
    initial: 1
    mode: slider
  hex_wall_led_count:
    name: Hex wall LEDs per tile
    min: 1
    max: 60
    step: 1
    initial: 44
    mode: box
automation:
  - id: hex_wall_fx_changed
    alias: Hex wall - synced effect / palette / speed changed
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_select.hex_wall_fx, input_select.hex_wall_palette, input_select.hex_wall_axis, input_number.hex_wall_speed]
    actions:
      - delay: {milliseconds: 300}
      - action: script.hex_wall_fx_apply
  - id: hex_wall_led_count_changed
    alias: Hex wall - LED count changed
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.hex_wall_led_count
    actions:
      - delay: {seconds: 1}
      - action: script.hex_wall_led_count_apply
  - id: hex_wall_sync_jumper_lost
    alias: Hex wall - jumper sync lost
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: ["sensor.hex_01_sync_source", "sensor.hex_02_sync_source", "sensor.hex_03_sync_source", "sensor.hex_04_sync_source", "sensor.hex_05_sync_source", "sensor.hex_06_sync_source", "sensor.hex_07_sync_source", "sensor.hex_08_sync_source", "sensor.hex_09_sync_source", "sensor.hex_10_sync_source", "sensor.hex_11_sync_source", "sensor.hex_12_sync_source", "sensor.hex_13_sync_source", "sensor.hex_14_sync_source", "sensor.hex_15_sync_source", "sensor.hex_16_sync_source", "sensor.hex_17_sync_source", "sensor.hex_18_sync_source", "sensor.hex_19_sync_source", "sensor.hex_20_sync_source"]
        to: "jumper-lost"
        for: {seconds: 15}
    conditions:
      - condition: state
        entity_id: select.hex_01_sync_mode
        state: "Jumper wire"
    actions:
      - action: notify.notify
        data:
          title: Hex wall sync
          message: >-
            {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }} lost the
            jumper-wire sync pulse (falling back to the ESP-NOW clock). Check the GPIO12 wire.
      - delay: {minutes: 10}

# Quins Room (/quins-room, view 'quins') Hex Lights control panel, exported from Home Assistant 2026-10-16.
# Requires: the hex_wall package (ha/hex_wall.generated.yaml), Mushroom, card-mod,
# resource /local/hex-layout-card/hex-layout-card.js?v=4 (type module).
# Static: the panel drives input_select.hex_wall_target ('All' + 'Hex NN'), light.hex_target,
# switch.hex_target_manual_color and the hex_wall_* effect helpers, so Hex 03..20 need no edits here
# (they join the target list and the layout card's tray automatically once flashed).
- type: heading
  heading: Hex Lights
  heading_style: title
  icon: mdi:hexagon-multiple
- type: custom:hex-layout-card
  layout_id: hex_layout_quin
  title: Hex layout
  grid_options:
    columns: 12
  layout:
    tiles:
      light.hex_01_light:
        q: 0
        r: 0
        rot: 0
      light.hex_02_light:
        q: 0
        r: 1
    groups: []
- type: tile
  entity: input_select.hex_wall_target
  name: Target
  icon: mdi:hexagon-multiple-outline
  features:
  - type: select-options
  features_position: inline
  grid_options:
    columns: 12
  card_mod:
    style: 'ha-card { background: rgba(255,255,255,0.08) !important; backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.14)
      !important; border-radius: 22px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.35) !important; }'
- type: custom:mushroom-light-card
  entity: light.hex_target
  name: Hex
  icon: mdi:hexagon-multiple
  use_light_color: true
  show_brightness_control: true
  show_color_control: false
  grid_options:
    columns: 12
  card_mod:
    style:
      .: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{% set l = state_attr(''light.hex_target'',''rgb_color'')
        or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'',
        255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('', '') %}ha-card { --rgb-state-light: {{ rgb }}; }'
      mushroom-light-brightness-control$:
        .: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{% set l = state_attr(''light.hex_target'',''rgb_color'')
          or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'',
          255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('', '') %}:host { --slider-color: rgb({{ rgb }}) !important;
          --slider-bg-color: rgba({{ rgb }}, 0.2) !important; }'
        mushroom-slider$: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{%
          set l = state_attr(''light.hex_target'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx
          = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('',
          '') %}.slider { --main-color: rgb({{ rgb }}) !important; --bg-color: rgba({{ rgb }}, 0.2) !important; } .slider .slider-track-active { background-color: rgb({{ rgb }}) !important; } .slider .slider-track-background
          { background-color: rgba({{ rgb }}, 0.2) !important; }'
      mushroom-shape-icon$: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{%
        set l = state_attr(''light.hex_target'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx
        = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('',
        '') %}.shape { --icon-color: rgb({{ rgb }}) !important; --shape-color: rgba({{ rgb }}, 0.2) !important; background-color: rgba({{ rgb }}, 0.2) !important; } .shape ha-state-icon, .shape ha-icon,
        .shape ::slotted(*) { color: rgb({{ rgb }}) !important; }'
  show_color_temp_control: false
  visibility:
  - condition: state
    entity: switch.hex_target_manual_color
    state: 'off'
- type: custom:mushroom-light-card
  entity: light.hex_target
  name: Hex
  icon: mdi:hexagon-multiple
  use_light_color: true
  show_brightness_control: true
  show_color_control: true
  collapsible_controls: false
  grid_options:
    columns: 12
  card_mod:
    style:
      .: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{% set l = state_attr(''light.hex_target'',''rgb_color'')
        or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'',
        255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('', '') %}ha-card { --rgb-state-light: {{ rgb }}; }'
      mushroom-light-brightness-control$:
        .: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{% set l = state_attr(''light.hex_target'',''rgb_color'')
          or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'',
          255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('', '') %}:host { --slider-color: rgb({{ rgb }}) !important;
          --slider-bg-color: rgba({{ rgb }}, 0.2) !important; }'
        mushroom-slider$: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{%
          set l = state_attr(''light.hex_target'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx
          = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('',
          '') %}.slider { --main-color: rgb({{ rgb }}) !important; --bg-color: rgba({{ rgb }}, 0.2) !important; } .slider .slider-track-active { background-color: rgb({{ rgb }}) !important; } .slider .slider-track-background
          { background-color: rgba({{ rgb }}, 0.2) !important; }'
      mushroom-shape-icon$: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{% set d = states(s) %}{%
        set l = state_attr(''light.hex_target'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx
        = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('',
        '') %}.shape { --icon-color: rgb({{ rgb }}) !important; --shape-color: rgba({{ rgb }}, 0.2) !important; background-color: rgba({{ rgb }}, 0.2) !important; } .shape ha-state-icon, .shape ha-icon,
        .shape ::slotted(*) { color: rgb({{ rgb }}) !important; }'
  visibility:
  - condition: state
    entity: switch.hex_target_manual_color
    state: 'on'
- type: custom:mushroom-template-card
  primary: Displayed color
  secondary: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{{ states(s) }}'
  icon: mdi:hexagon
  icon_color: '{% set t = states(''input_select.hex_wall_target'') %}{% set s = ''sensor.hex_'' ~ (t[4:] if t[:4] == ''Hex '' else ''01'') ~ ''_displayed_color'' %}{{ states(s) }}'
  entity: light.hex_target
  tap_action:
    action: toggle
  hold_action:
    action: more-info
- type: tile
  entity: switch.hex_target_manual_color
  name: Manual color
  icon: mdi:palette
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  card_mod:
    style: 'ha-card { background: rgba(255,255,255,0.08) !important; backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.14)
      !important; border-radius: 22px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.35) !important; }'
- type: entities
  state_color: true
  grid_options:
    columns: 12
  card_mod:
    style: 'ha-card { background: rgba(255,255,255,0.08) !important; backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.14)
      !important; border-radius: 22px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.35) !important; }'
  entities:
  - entity: input_select.hex_wall_fx
    name: Effect
  - entity: input_select.hex_wall_palette
    name: Palette
  - entity: input_number.hex_wall_speed
    name: Speed
  - entity: input_select.hex_wall_axis
    name: Wipe axis
  visibility:
  - condition: state
    entity: switch.hex_target_manual_color
    state: 'off'

# Quins Room (/quins-room, view 'quins') Hex Lights cards, exported from Home Assistant 2026-10-16.
# Requires: Mushroom, card-mod (HACS), resource /local/hex-layout-card/hex-layout-card.js?v=3 (type module).
- type: heading
  heading: Hex Lights
  heading_style: title
  icon: mdi:hexagon-multiple
- type: custom:hex-layout-card
  layout_id: hex_layout_quin
  title: Hex layout
  grid_options:
    columns: 12
  layout:
    tiles:
      light.hex_01_light:
        q: 0
        r: 0
        rot: 0
    groups: []
- type: custom:mushroom-light-card
  entity: light.hex_01_light
  name: Hex 01
  icon: mdi:hexagon-multiple
  use_light_color: true
  show_brightness_control: true
  show_color_control: true
  collapsible_controls: false
  grid_options:
    columns: 12
  card_mod:
    style:
      .: '{% set d = states(''sensor.hex_01_displayed_color'') %}{% set l = state_attr(''light.hex_01_light'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16),
        d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{%
        set c = l %}{% endif %}{% set rgb = c|join('', '') %}ha-card { --rgb-state-light: {{ rgb }}; }'
      mushroom-light-brightness-control$:
        .: '{% set d = states(''sensor.hex_01_displayed_color'') %}{% set l = state_attr(''light.hex_01_light'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{% set v = [d[1:3]|int(0,16),
          d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c = l %}{% endif %}{% else %}{%
          set c = l %}{% endif %}{% set rgb = c|join('', '') %}:host { --slider-color: rgb({{ rgb }}) !important; --slider-bg-color: rgba({{ rgb }}, 0.2) !important; }'
        mushroom-slider$: '{% set d = states(''sensor.hex_01_displayed_color'') %}{% set l = state_attr(''light.hex_01_light'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'') %}{%
          set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set c
          = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('', '') %}.slider { --main-color: rgb({{ rgb }}) !important; --bg-color: rgba({{ rgb }}, 0.2) !important; } .slider .slider-track-active
          { background-color: rgb({{ rgb }}) !important; } .slider .slider-track-background { background-color: rgba({{ rgb }}, 0.2) !important; }'
      mushroom-shape-icon$: '{% set d = states(''sensor.hex_01_displayed_color'') %}{% set l = state_attr(''light.hex_01_light'',''rgb_color'') or [255,214,160] %}{% if d is match(''^#[0-9A-Fa-f]{6}$'')
        %}{% set v = [d[1:3]|int(0,16), d[3:5]|int(0,16), d[5:7]|int(0,16)] %}{% set mx = v|max %}{% if mx > 0 %}{% set c = v|map(''multiply'', 255/mx)|map(''round'')|map(''int'')|list %}{% else %}{% set
        c = l %}{% endif %}{% else %}{% set c = l %}{% endif %}{% set rgb = c|join('', '') %}.shape { --icon-color: rgb({{ rgb }}) !important; --shape-color: rgba({{ rgb }}, 0.2) !important; background-color:
        rgba({{ rgb }}, 0.2) !important; } .shape ha-state-icon, .shape ha-icon, .shape ::slotted(*) { color: rgb({{ rgb }}) !important; }'
- type: custom:mushroom-template-card
  primary: Displayed color
  secondary: '{{ states("sensor.hex_01_displayed_color") }}'
  icon: mdi:hexagon
  icon_color: '{{ states("sensor.hex_01_displayed_color") }}'
  entity: light.hex_01_light
  tap_action:
    action: toggle
  hold_action:
    action: more-info
- type: entities
  state_color: true
  grid_options:
    columns: 12
  card_mod:
    style: 'ha-card { background: rgba(255,255,255,0.08) !important; backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.14)
      !important; border-radius: 22px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.35) !important; }'
  entities:
  - entity: select.hex_01_wall_effect
    name: Effect
  - entity: select.hex_01_wall_palette
    name: Palette
  - entity: number.hex_01_wall_speed
    name: Speed
  - entity: select.hex_01_wall_wipe_axis
    name: Wipe axis

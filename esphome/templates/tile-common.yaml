# Shared package for every hex tile. Tested with ESPHome 2025.9.3 (see README).
# Per-tile files in tiles/ only set substitutions and include this file.
#
# Required substitutions: tile_id, tile_num, q, r
# Optional (defaults below): rotation, led_pin, num_leds, leader_priority,
#   static_leader, max_scale, tile_budget_ma

substitutions:
  rotation: "0"
  led_pin: GPIO4            # S3 Super Mini: avoid 0/3/45/46 (strapping), 19/20 (USB), 48 (onboard RGB LED)
  num_leds: "44"
  leader_priority: ${tile_num}
  static_leader: "0"        # 0 = automatic failover; set to a tile_num to pin the leader
  max_scale: "0.55"         # hard per-channel ceiling: 44 x 60 mA x 0.55 ~= 1.45 A per tile (ESTIMATE)
  max_scale_pct: "55%"
  tile_budget_ma: "1200"    # hexsync effect current budget per tile (ESTIMATED model)

esphome:
  name: hex-${tile_id}
  friendly_name: Hex ${tile_id}
  min_version: 2025.9.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [hexsync]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  actions:
    # Call on ANY tile; it broadcasts a new parameter generation to the wall.
    - action: set_wall_effect
      variables:
        effect: int        # 0 solid, 1 radial wave, 2 rainbow sweep, 3 pulse
        hue: int           # 0-255
        saturation: int    # 0-255
        value: int         # 0-255
        speed: int         # milli-cycles per second (500 = 0.5 Hz)
        scale: int         # tiles per cycle x100
      then:
        - lambda: 'id(hex_sync).set_effect(effect, hue, saturation, value, speed, scale);'
        - light.turn_on:
            id: tile_leds
            effect: HexSync

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # ESP-NOW latency suffers badly with modem sleep
  ap:
    password: !secret fallback_ap_password

captive_portal:

hexsync:
  id: hex_sync
  tile_id: ${tile_num}
  q: ${q}
  r: ${r}
  rotation: ${rotation}
  leader_priority: ${leader_priority}
  static_leader: ${static_leader}
  tile_budget_ma: ${tile_budget_ma}
  hard_max_scale: ${max_scale}

light:
  - platform: esp32_rmt_led_strip
    id: tile_leds
    name: Light
    pin: ${led_pin}
    num_leds: ${num_leds}
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    # Hard ceiling for EVERYTHING this light shows (HA solid colors too).
    color_correct: ["${max_scale_pct}", "${max_scale_pct}", "${max_scale_pct}"]
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - addressable_lambda:
          name: HexSync
          update_interval: 16ms   # ~60 fps target; 44 LEDs take ~1.4 ms on the wire
          lambda: 'id(hex_sync).render(it);'
      - addressable_rainbow:
          name: Local rainbow (unsynced)

sensor:
  - platform: template
    name: Effect current estimate
    unit_of_measurement: mA
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(hex_sync).last_est_ma();'
  - platform: template
    name: Sync clock offset
    unit_of_measurement: ms
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(hex_sync).clock_offset();'
  - platform: template
    name: Sync leader
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(hex_sync).leader_id();'
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s

binary_sensor:
  - platform: template
    name: Sync leader (this tile)
    entity_category: diagnostic
    lambda: 'return id(hex_sync).is_leader();'

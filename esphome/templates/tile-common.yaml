# Shared package for every hex tile. Tested with ESPHome 2025.9.3 (see README).
# Per-tile files in tiles/ only set substitutions and include this file.
#
# Required substitutions: tile_id, tile_num, q, r
# Optional (defaults below): rotation, led_pin, num_leds, leader_priority,
#   static_leader, max_scale, tile_budget_ma

substitutions:
  rotation: "0"
  order: "-1"               # chase index; -1 = tile_num - 1
  led_pin: GPIO13            # S3 Super Mini: avoid 0/3/45/46 (strapping), 19/20 (USB), 48 (onboard RGB LED)
  num_leds: "60"            # pixels allocated (layout.json led.maxCount)
  sync_pin: GPIO12           # jumper-mode sync line; untouched in wireless mode
  sync_mode_default: wireless # first-boot only; the mode saved in flash wins afterwards
  led_count: "44"           # pixels rendered by default; runtime number "LED count"
  wall_controls_internal: "true"   # generator sets "false" on the master tile
  leader_priority: ${tile_num}
  static_leader: "0"        # 0 = automatic failover; set to a tile_num to pin the leader
  max_scale: "0.55"         # hard per-channel ceiling: 44 x 60 mA x 0.55 ~= 1.45 A per tile (ESTIMATE)
  max_scale_pct: "55%"
  tile_budget_ma: "1200"    # hexsync effect current budget per tile (ESTIMATED model)

esphome:
  name: hex-${tile_id}
  friendly_name: Hex ${tile_id}
  min_version: 2025.9.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [hexsync]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  actions:
    # Call on ANY tile; it broadcasts a new parameter generation to the wall.
    - action: set_wall_effect
      variables:
        effect: int        # 0 solid, 1 radial wave, 2 rainbow sweep, 3 pulse
        hue: int           # 0-255
        saturation: int    # 0-255
        value: int         # 0-255
        speed: int         # milli-cycles per second (500 = 0.5 Hz)
        scale: int         # tiles per cycle x100
      then:
        - lambda: 'id(hex_sync).set_effect(effect, hue, saturation, value, speed, scale);'
        - light.turn_on:
            id: tile_leds
            effect: HexSync
    # Layout editor: call on the master tile (hex-c0). Entries for other tiles
    # go out as an ESP-NOW HX_LAYOUT broadcast; each tile applies its own and saves it.
    # v2 wall effect (Back End interface): call on the master -> esphome.hex_c0_set_wall_fx
    - action: set_wall_fx
      variables:
        effect: int          # 0..10, see DESIGN.md
        palette: int         # 0 rainbow 1 ocean 2 sunset 3 forest 4 fire 5 mono
        speed: int           # milli-cycles/s
        scale: int           # x100
        hue: int             # 0-255
        saturation: int      # 0-255
        value: int           # 0-255
        start_delay_ms: int  # leader start_ms = clock + delay
        axis: int            # 0 x, 1 y, 2 ring, 3 angle (REQUIRED: ESPHome API action args can't be optional)
      then:
        - lambda: |-
            id(hex_sync).set_wall_fx(effect, palette, speed, scale, hue, saturation, value, start_delay_ms, axis);
        - light.turn_on:
            id: tile_leds
            effect: HexSync
    - action: set_tile_layout
      variables:
        tile_id: int       # tile_num 1..N (row order of tiles.csv)
        q: int
        r: int
        rotation: int      # degrees
        order: int         # chase index 0..254
      then:
        - lambda: 'id(hex_sync).send_tile_layout(tile_id, q, r, rotation, order);'
    - action: set_layout_bulk
      variables:
        layout: string     # "id:q:r:rot:order;id:q:r:rot:order;..."
      then:
        - lambda: |-
            int n = id(hex_sync).send_layout_bulk(layout);
            if (n < 0) ESP_LOGW("hexsync", "set_layout_bulk: parse error");
            else ESP_LOGI("hexsync", "set_layout_bulk: sent %d entries", n);

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # ESP-NOW latency suffers badly with modem sleep
  ap:
    password: !secret fallback_ap_password

captive_portal:

hexsync:
  id: hex_sync
  tile_id: ${tile_num}
  q: ${q}
  r: ${r}
  rotation: ${rotation}
  order: ${order}
  led_count: ${led_count}
  sync_pin: ${sync_pin}
  sync_mode_default: ${sync_mode_default}
  leader_priority: ${leader_priority}
  static_leader: ${static_leader}
  tile_budget_ma: ${tile_budget_ma}
  hard_max_scale: ${max_scale}

light:
  - platform: esp32_rmt_led_strip
    id: tile_leds
    name: Light
    pin: ${led_pin}
    num_leds: ${num_leds}
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    # Hard ceiling for EVERYTHING this light shows (HA solid colors too).
    color_correct: ["${max_scale_pct}", "${max_scale_pct}", "${max_scale_pct}"]
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - addressable_lambda:
          name: HexSync
          update_interval: 16ms   # ~60 fps target; 44 LEDs take ~1.4 ms on the wire
          lambda: 'id(hex_sync).render(it);'
      - addressable_rainbow:
          name: Local rainbow (unsynced)

sensor:
  - platform: template
    name: Effect current estimate
    unit_of_measurement: mA
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(hex_sync).last_est_ma();'
  - platform: template
    name: Sync clock offset
    unit_of_measurement: ms
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(hex_sync).clock_offset();'
  - platform: template
    name: Sync leader
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(hex_sync).leader_id();'
  - platform: template
    name: Layout generation
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(hex_sync).layout_gen();'
  - platform: template
    name: Peers seen
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(hex_sync).peer_count();'
  - platform: template
    name: Sync pulse jitter
    entity_category: diagnostic
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(hex_sync).pulse_jitter_us();'
  - platform: template
    name: Sync pulse offset
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(hex_sync).pulse_offset_ms();'
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s

# Runtime layout. Values persist in flash inside hexsync (template numbers can't
# use restore_value together with a lambda), so the effect is the same:
# compile-time substitutions are first-boot defaults, later changes survive reboot.
number:
  - platform: template
    name: LED count
    id: led_count_number
    entity_category: config
    min_value: 1
    max_value: ${num_leds}
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).led_count();'
    set_action:
      - lambda: 'id(hex_sync).set_led_count((int) x);'
  # Shared wall controls; visible in HA only on the master (internal elsewhere).
  - platform: template
    name: Wall speed
    internal: ${wall_controls_internal}
    unit_of_measurement: "mc/s"
    min_value: 0
    max_value: 10000
    step: 10
    update_interval: 2s
    lambda: 'return id(hex_sync).wall_speed();'
    set_action:
      - lambda: 'id(hex_sync).set_wall_speed((int) x);'
  - platform: template
    name: Grid q
    entity_category: config
    min_value: -50
    max_value: 50
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).q();'
    set_action:
      - lambda: 'id(hex_sync).set_q((int) x);'
  - platform: template
    name: Grid r
    entity_category: config
    min_value: -50
    max_value: 50
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).r();'
    set_action:
      - lambda: 'id(hex_sync).set_r((int) x);'
  - platform: template
    name: Rotation
    entity_category: config
    unit_of_measurement: "°"
    min_value: 0
    max_value: 359
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).rotation();'
    set_action:
      - lambda: 'id(hex_sync).set_rotation((int) x);'
  - platform: template
    name: Chase order
    entity_category: config
    min_value: 0
    max_value: 254
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).order();'
    set_action:
      - lambda: 'id(hex_sync).set_order((int) x);'

select:
  - platform: template
    name: Wall effect
    internal: ${wall_controls_internal}
    options: [solid, radial_wave, rainbow_sweep, pulse, chase, wipe, rainbow_flow, random_ripple, twinkle, color_cycle, snake]
    update_interval: 2s
    lambda: 'return std::string(hexsync::HexSync::effect_name(id(hex_sync).wall_effect()));'
    set_action:
      - lambda: 'id(hex_sync).set_wall_effect_id(hexsync::HexSync::effect_id(x));'
      - light.turn_on:
          id: tile_leds
          effect: HexSync
  - platform: template
    name: Wall palette
    internal: ${wall_controls_internal}
    options: [rainbow, ocean, sunset, forest, fire, mono]
    update_interval: 2s
    lambda: 'return std::string(hexsync::HexSync::palette_name(id(hex_sync).wall_palette()));'
    set_action:
      - lambda: 'id(hex_sync).set_wall_palette(hexsync::HexSync::palette_id(x));'
  - platform: template
    name: Wall wipe axis
    internal: ${wall_controls_internal}
    options: [x, y, ring, angle]
    update_interval: 2s
    lambda: |-
      static const char *const ax[4] = {"x", "y", "ring", "angle"};
      return std::string(ax[id(hex_sync).wall_axis() & 3]);
    set_action:
      - lambda: |-
          int v = x == "y" ? 1 : x == "ring" ? 2 : x == "angle" ? 3 : 0;
          id(hex_sync).set_wall_axis(v);

  - platform: template
    name: Sync mode
    internal: ${wall_controls_internal}
    options: ["Wireless (ESP-NOW)", "Jumper wire"]
    update_interval: 2s
    lambda: 'return std::string(id(hex_sync).sync_mode() ? "Jumper wire" : "Wireless (ESP-NOW)");'
    set_action:
      - lambda: 'id(hex_sync).set_sync_mode(x == "Jumper wire" ? 1 : 0);'

text_sensor:
  - platform: template
    name: Sync source
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return std::string(id(hex_sync).sync_source());'

  - platform: template
    name: Layout
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(hex_sync).layout_string();'
  - platform: template
    name: Neighbors
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(hex_sync).neighbor_list();'

binary_sensor:
  - platform: template
    name: Sync leader (this tile)
    entity_category: diagnostic
    lambda: 'return id(hex_sync).is_leader();'

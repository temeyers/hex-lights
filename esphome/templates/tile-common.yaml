# Shared package for every hex tile. Tested with ESPHome 2025.9.3 (see README).
# Per-tile files in tiles/ only set substitutions and include this file.
#
# Required substitutions: hex_nn ("01".. user-visible name), tile_num, q, r
# (q/r/tile_num are internal; axial ids like c0 never reach HA)
# Optional (defaults below): rotation, led_pin, num_leds, leader_priority,
#   static_leader, max_scale, tile_budget_ma

substitutions:
  rotation: "0"
  order: "-1"               # chase index; -1 = tile_num - 1
  led_pin: GPIO13            # S3 Super Mini: avoid 0/3/45/46 (strapping), 19/20 (USB), 48 (onboard RGB LED)
  num_leds: "60"            # pixels allocated (layout.json led.maxCount)
  sync_pin: GPIO12           # jumper-mode sync line; untouched in wireless mode
  sync_mode_default: wireless # first-boot only; the mode saved in flash wins afterwards
  led_count: "44"           # pixels rendered by default; runtime number "LED count"
  wall_controls_internal: "true"   # generator sets "false" on the master tile
  leader_priority: ${tile_num}
  static_leader: "0"        # 0 = automatic failover; set to a tile_num to pin the leader
  # Full output by default: 100% on the slider = full LED drive. Runtime ceiling = HA number "Max brightness".
  # WARNING: full white ~= 44 x 60 mA ~= 2.6 A per tile (~53 A wall). Feed the strip directly (not via the
  # S3 Super Mini 5V pin); keep 3 A per-tile fuses and the 60 A PSU. See README / DESIGN.md.
  boot_brightness: "30%"    # light brightness applied on every boot (on_boot -100)
  led_gamma: "2.8"          # ESPHome default; gamma never lowers 255 but dims mid levels (value 180 -> ~38 %)
  max_scale: "1.0"          # first-boot value for hexsync's current model (Max brightness overrides at boot)
  tile_budget_ma: "1200"    # hexsync effect current budget per tile (ESTIMATED model); OFF unless "Current limit" switch is on

esphome:
  name: hex-${hex_nn}
  friendly_name: Hex ${hex_nn}
  min_version: 2025.9.0
  on_boot:
    # Restore (numbers/switches) fires BEFORE the light is set up: touching the light there crashed 85cf36d
    # (update_state -> schedule_show -> null LightState). Apply brightness/limit here, after every setup().
    - priority: -100
      then:
        - lambda: |-
            float pct = id(max_brightness).state;
            if (std::isnan(pct)) pct = 100.0f;
            float k = std::max(0.0f, std::min(1.0f, pct / 100.0f));
            id(hex_sync).set_max_scale(k);
            id(hex_sync).set_budget_enabled(id(current_limit).state);
            auto *out = static_cast<light::AddressableLight *>(id(tile_leds).get_output());
            if (out != nullptr) {
              out->set_correction(k, k, k);
              if (id(tile_leds).current_values.is_on()) out->update_state(id(tile_leds));
            }
            // Master: restore the saved wall effect/palette/axis/speed/scale (globals below) and start it on the
            // whole wall. Here, not in a restore callback: hexsync and the light are set up, ESP-NOW may still be
            // coming up (beacons repeat the params anyway).
            if (!${wall_controls_internal} && id(wall_pal_saved) == 6) {  // saved by 7dfa536 'light color'
              id(wall_pal_saved) = 0;
              id(manual_color).publish_state(true);  // bright_ready still false: on_turn_on below is a no-op
            }
            if (!${wall_controls_internal} && id(wall_fx_saved) >= 0) {
              auto &hs = *id(hex_sync);
              hs.set_wall_fx(id(wall_fx_saved), id(wall_pal_saved), id(wall_speed_saved), id(wall_scale_saved),
                             160, 255, 255, 300, id(wall_axis_saved));
              ESP_LOGI("hexsync", "restored wall fx %s pal %s speed %d scale %d axis %d",
                       hexsync::HexSync::effect_name(id(wall_fx_saved)), hexsync::HexSync::palette_name(id(wall_pal_saved)),
                       id(wall_speed_saved), id(wall_scale_saved), id(wall_axis_saved));
            }
            if (!${wall_controls_internal}) id(hex_sync).set_manual_color(id(manual_color).state);  // master owns it
            id(bright_ready) = true;
            ESP_LOGI("hexsync", "brightness: max_brightness=%.0f%% (max_scale %.2f), current_limit=%s (budget %d mA), effect value=%d/255, gamma=%s, transition 0s",
                     pct, id(hex_sync).max_scale(), id(hex_sync).budget_enabled() ? "ON" : "off",
                     id(hex_sync).budget_ma(), id(hex_sync).effect_value(), "${led_gamma}");
        # Power-on brightness: 30% every boot (light + hexsync are set up by now; LightCall is safe here).
        # Keeps the restored colour/effect; Max brightness stays a separate ceiling (default 100%).
        - light.turn_on:
            id: tile_leds
            brightness: ${boot_brightness}

globals:
  # Wall controls persisted on the master (template select/number with a lambda can't take restore_value).
  # Written only by the interval below, after bright_ready; applied in on_boot(-100). -1 = never saved.
  - id: wall_fx_saved
    type: int
    restore_value: true
    initial_value: "-1"
  - id: wall_pal_saved
    type: int
    restore_value: true
    initial_value: "0"
  - id: wall_axis_saved
    type: int
    restore_value: true
    initial_value: "0"
  - id: wall_speed_saved
    type: int
    restore_value: true
    initial_value: "500"
  - id: wall_scale_saved
    type: int
    restore_value: true
    initial_value: "300"
  - id: bright_ready         # true once on_boot(-100) ran; restore-time callbacks must not touch the light
    type: bool
    restore_value: false
    initial_value: "false"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [hexsync]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  actions:
    # Call on ANY tile; it broadcasts a new parameter generation to the wall.
    - action: set_wall_effect
      variables:
        effect: int        # 0 solid, 1 radial wave, 2 rainbow sweep, 3 pulse
        hue: int           # 0-255
        saturation: int    # 0-255
        value: int         # 0-255
        speed: int         # milli-cycles per second (500 = 0.5 Hz)
        scale: int         # tiles per cycle x100
      then:
        - lambda: 'id(hex_sync).set_effect(effect, hue, saturation, value, speed, scale);'
        - light.turn_on:
            id: tile_leds
            effect: HexSync
    # Layout editor: call on the master (hex-01). Entries for other tiles
    # go out as an ESP-NOW HX_LAYOUT broadcast; each tile applies its own and saves it.
    # v2 wall effect (Back End interface): call on the master -> esphome.hex_01_set_wall_fx
    - action: set_wall_fx
      variables:
        effect: int          # 0..10, see DESIGN.md
        palette: int         # 0 rainbow 1 ocean 2 sunset 3 forest 4 fire 5 mono 6 light color
        speed: int           # milli-cycles/s
        scale: int           # x100
        hue: int             # 0-255
        saturation: int      # 0-255
        value: int           # 0-255
        start_delay_ms: int  # leader start_ms = clock + delay
        axis: int            # 0 x, 1 y, 2 ring, 3 angle (REQUIRED: ESPHome API action args can't be optional)
      then:
        - lambda: |-
            id(hex_sync).set_wall_fx(effect, palette, speed, scale, hue, saturation, value, start_delay_ms, axis);
        - light.turn_on:
            id: tile_leds
            effect: HexSync
    - action: set_hex_layout
      variables:
        hex_num: int       # 1..N = NN in hex-NN (row order of tiles.csv)
        q: int
        r: int
        rotation: int      # degrees
        order: int         # chase index 0..254
      then:
        - lambda: 'id(hex_sync).send_tile_layout(hex_num, q, r, rotation, order);'
    - action: set_layout_bulk
      variables:
        layout: string     # "id:q:r:rot:order;id:q:r:rot:order;..."
      then:
        - lambda: |-
            int n = id(hex_sync).send_layout_bulk(layout);
            if (n < 0) ESP_LOGW("hexsync", "set_layout_bulk: parse error");
            else ESP_LOGI("hexsync", "set_layout_bulk: sent %d entries", n);

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # ESP-NOW latency suffers badly with modem sleep
  reboot_timeout: 0s       # don't reboot while sitting in fallback AP (default 15 min would drop the AP)
  ap:
    ssid: hex-${hex_nn}
    ap_timeout: 30s        # fallback AP comes up 30 s after STA fails (default 1 min)
    password: !secret fallback_ap_password   # must be 8+ chars or the AP won't start

captive_portal:

hexsync:
  id: hex_sync
  tile_id: ${tile_num}
  q: ${q}
  r: ${r}
  rotation: ${rotation}
  order: ${order}
  led_count: ${led_count}
  sync_pin: ${sync_pin}
  sync_mode_default: ${sync_mode_default}
  leader_priority: ${leader_priority}
  static_leader: ${static_leader}
  tile_budget_ma: ${tile_budget_ma}
  hard_max_scale: ${max_scale}

light:
  - platform: esp32_rmt_led_strip
    id: tile_leds
    name: Light
    pin: ${led_pin}
    num_leds: ${num_leds}
    chipset: WS2812
    rgb_order: GRB   # 2025.9.x lacks channel_colors; 2026.x accepts rgb_order (deprecated, removed 2027.3.0) -> switch to "channel_colors: GRB" once 2025.9 support is dropped
    default_transition_length: 0s
    gamma_correct: ${led_gamma}
    # No compile-time cap: the "Max brightness" number sets the correction (ceiling) at runtime.
    restore_mode: RESTORE_AND_ON   # colour + effect restored, always comes up on (brightness forced to 30% in on_boot)
    effects:
      - addressable_lambda:
          name: HexSync
          update_interval: 16ms   # ~60 fps target; 44 LEDs take ~1.4 ms on the wire
          lambda: |-
            // solid / mono palette follow THIS tile's light colour live (brightness via the light's correction)
            auto &v = id(tile_leds).current_values;
            id(hex_sync).set_light_color(v.get_red(), v.get_green(), v.get_blue());
            id(hex_sync).set_light_level(v.is_on() ? v.get_brightness() : 0.0f);
            // master: the user's chosen colour (remote_values = last HA/API call target, read-only) feeds the
            // "light color" palette on every tile via the hexsync packet. Never written back to the light.
            if (!${wall_controls_internal}) {
              auto &rv = id(tile_leds).remote_values;
              id(hex_sync).set_wall_rgb(rv.get_red(), rv.get_green(), rv.get_blue());
            }
            id(hex_sync).render(it);
    # HexSync is always on: it is the only effect, and any "effect: None" (HA device page, light.turn_on without
    # effect) is turned straight back into HexSync. Solid colour = manual colour / solid wall effect.
    on_state:
      - if:
          condition:
            lambda: 'return id(bright_ready) && id(tile_leds).remote_values.is_on() && id(tile_leds).get_effect_name() != "HexSync";'
          then:
            - light.turn_on:
                id: tile_leds
                effect: HexSync

sensor:
  - platform: template
    name: Effect current estimate
    unit_of_measurement: mA
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(hex_sync).last_est_ma();'
  - platform: template
    name: Sync clock offset
    unit_of_measurement: ms
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(hex_sync).clock_offset();'
  - platform: template
    name: Sync leader
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(hex_sync).leader_id();'
  - platform: template
    name: Layout generation
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(hex_sync).layout_gen();'
  - platform: template
    name: Peers seen
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(hex_sync).peer_count();'
  - platform: template
    name: Sync pulse jitter
    entity_category: diagnostic
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(hex_sync).pulse_jitter_us();'
  - platform: template
    name: Sync pulse offset
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(hex_sync).pulse_offset_ms();'
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s

# Runtime layout. Values persist in flash inside hexsync (template numbers can't
# use restore_value together with a lambda), so the effect is the same:
# compile-time substitutions are first-boot defaults, later changes survive reboot.
number:
  # Runtime ceiling for EVERYTHING this light shows (effects and HA solid colors), 0-100 %.
  - platform: template
    name: Max brightness
    id: max_brightness
    entity_category: config
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          if (std::isnan(x)) return;
          if (!id(bright_ready)) return;   // fired by restore during setup: on_boot(-100) applies it safely
          float k = std::max(0.0f, std::min(1.0f, x / 100.0f));
          id(hex_sync).set_max_scale(k);
          auto *out = static_cast<light::AddressableLight *>(id(tile_leds).get_output());
          if (out == nullptr) return;
          out->set_correction(k, k, k);
          if (id(tile_leds).current_values.is_on()) out->update_state(id(tile_leds));  // re-render a static colour
  - platform: template
    name: LED count
    id: led_count_number
    entity_category: config
    min_value: 1
    max_value: ${num_leds}
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).led_count();'
    set_action:
      - lambda: 'id(hex_sync).set_led_count((int) x);'
  # Shared wall controls; visible in HA only on the master (internal elsewhere).
  # White shades for Manual color. The LEDs are RGB-only (WS2812), so colour temperature is emulated: setting
  # this number converts the Kelvin value to RGB (Tanner Helland blackbody fit) and sets the light colour.
  # Brightness is left alone. The value is the last white chosen; it is not updated by later RGB changes.
  - platform: template
    id: white_temp
    name: White temperature
    icon: mdi:thermometer
    unit_of_measurement: K
    min_value: 2000
    max_value: 6500
    step: 100
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 4000
    set_action:
      - lambda: |-
          float t = x / 100.0f, r, g, b;
          if (t <= 66) { r = 255; g = 99.4708025861f * logf(t) - 161.1195681661f; }
          else { r = 329.698727446f * powf(t - 60, -0.1332047592f); g = 288.1221695283f * powf(t - 60, -0.0755148492f); }
          if (t >= 66) b = 255; else if (t <= 19) b = 0; else b = 138.5177312231f * logf(t - 10) - 305.0447927307f;
          auto cl = [](float v) { return std::max(0.0f, std::min(255.0f, v)) / 255.0f; };
          auto call = id(tile_leds).make_call();
          call.set_rgb(cl(r), cl(g), cl(b));
          call.set_effect("HexSync");
          call.perform();
  - platform: template
    name: Wall speed
    internal: ${wall_controls_internal}
    unit_of_measurement: "mc/s"
    min_value: 0
    max_value: 10000
    step: 10
    update_interval: 2s
    lambda: 'return id(hex_sync).wall_speed();'
    set_action:
      - lambda: 'id(hex_sync).set_wall_speed((int) x);'
  - platform: template
    name: Grid q
    entity_category: config
    min_value: -50
    max_value: 50
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).q();'
    set_action:
      - lambda: 'id(hex_sync).set_q((int) x);'
  - platform: template
    name: Grid r
    entity_category: config
    min_value: -50
    max_value: 50
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).r();'
    set_action:
      - lambda: 'id(hex_sync).set_r((int) x);'
  - platform: template
    name: Rotation
    entity_category: config
    unit_of_measurement: "°"
    min_value: 0
    max_value: 359
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).rotation();'
    set_action:
      - lambda: 'id(hex_sync).set_rotation((int) x);'
  - platform: template
    name: Chase order
    entity_category: config
    min_value: 0
    max_value: 254
    step: 1
    update_interval: 2s
    lambda: 'return id(hex_sync).order();'
    set_action:
      - lambda: 'id(hex_sync).set_order((int) x);'

switch:
  # Manual color: ON = every tile shows its own light colour as solid (wall-wide flag); OFF = the wall effect runs.
  # Wall-wide (packet flags bit1). Restore only sets the state (optimistic); the master applies it to hexsync in
  # on_boot(-100), followers take the master's flag and their switch mirrors it.
  - platform: template
    id: manual_color
    name: Manual color
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'if (id(bright_ready)) id(hex_sync).set_manual_color(true);'
    on_turn_off:
      - lambda: 'if (id(bright_ready)) id(hex_sync).set_manual_color(false);'
  # Per-tile current budget (ESTIMATED model, hexsync effects only). Off = no firmware current cap.
  - platform: template
    name: Current limit
    id: current_limit
    entity_category: config
    icon: mdi:current-dc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # Only sets a bool in hexsync (no light access); on_boot(-100) re-applies the restored state too.
    turn_on_action:
      - lambda: 'if (id(bright_ready)) id(hex_sync).set_budget_enabled(true);'
    turn_off_action:
      - lambda: 'if (id(bright_ready)) id(hex_sync).set_budget_enabled(false);'

select:
  - platform: template
    name: Wall effect
    internal: ${wall_controls_internal}
    options: [solid, radial_wave, rainbow_sweep, pulse, chase, wipe, rainbow_flow, random_ripple, twinkle, color_cycle, snake]
    update_interval: 2s
    lambda: 'return std::string(hexsync::HexSync::effect_name(id(hex_sync).wall_effect()));'
    set_action:
      - lambda: 'id(hex_sync).set_wall_effect_id(hexsync::HexSync::effect_id(x));'
      - light.turn_on:
          id: tile_leds
          effect: HexSync
  - platform: template
    name: Wall palette
    internal: ${wall_controls_internal}
    options: [rainbow, ocean, sunset, forest, fire, mono]   # id 6 "light color" retired -> Manual color switch
    update_interval: 2s
    lambda: 'return std::string(hexsync::HexSync::palette_name(id(hex_sync).wall_palette()));'
    set_action:
      - lambda: 'id(hex_sync).set_wall_palette(hexsync::HexSync::palette_id(x));'
  - platform: template
    name: Wall wipe axis
    internal: ${wall_controls_internal}
    options: [x, y, ring, angle]
    update_interval: 2s
    lambda: |-
      static const char *const ax[4] = {"x", "y", "ring", "angle"};
      return std::string(ax[id(hex_sync).wall_axis() & 3]);
    set_action:
      - lambda: |-
          int v = x == "y" ? 1 : x == "ring" ? 2 : x == "angle" ? 3 : 0;
          id(hex_sync).set_wall_axis(v);

  - platform: template
    name: Sync mode
    internal: ${wall_controls_internal}
    options: ["Wireless (ESP-NOW)", "Jumper wire"]
    update_interval: 2s
    lambda: 'return std::string(id(hex_sync).sync_mode() ? "Jumper wire" : "Wireless (ESP-NOW)");'
    set_action:
      - lambda: 'id(hex_sync).set_sync_mode(x == "Jumper wire" ? 1 : 0);'

interval:
  # Master: mirror the live wall params (from selects, the number, set_wall_fx actions or peers) into the
  # restoring globals. Flash writes are batched by preferences and flushed on OTA/safe reboot.
  - interval: 2s
    then:
      - lambda: |-
          if (${wall_controls_internal} || !id(bright_ready)) return;
          auto &hs = *id(hex_sync);
          if (id(wall_fx_saved) != hs.wall_effect()) id(wall_fx_saved) = hs.wall_effect();
          if (id(wall_pal_saved) != hs.wall_palette()) id(wall_pal_saved) = hs.wall_palette();
          if (id(wall_axis_saved) != hs.wall_axis()) id(wall_axis_saved) = hs.wall_axis();
          if (id(wall_speed_saved) != hs.wall_speed()) id(wall_speed_saved) = hs.wall_speed();
          if (id(wall_scale_saved) != hs.wall_scale()) id(wall_scale_saved) = hs.wall_scale();
  # Every tile: Manual color switch mirrors the wall-wide flag (master or any tile's HA change, newest wins).
  - interval: 1s
    then:
      - lambda: |-
          if (!id(bright_ready)) return;
          bool m = id(hex_sync).manual_color();
          if (id(manual_color).state != m) id(manual_color).publish_state(m);  // on_turn_* -> set_manual_color no-op

text_sensor:
  # Average colour the LEDs are showing ('#RRGGBB', 2 Hz, published only on change). Read-only: never fed back
  # into the light or the "light color" palette. Not updated before on_boot(-100).
  - platform: template
    id: displayed_color   # HA: sensor.hex_NN_displayed_color (name + device hex-NN)
    name: Displayed color
    update_interval: 500ms
    lambda: |-
      if (!id(bright_ready)) return {};
      std::string s = id(hex_sync).displayed_color();
      if (s.empty()) return {};
      return s;
  - platform: template
    name: Sync source
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return std::string(id(hex_sync).sync_source());'

  - platform: template
    name: Layout
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(hex_sync).layout_string();'
  - platform: template
    name: Neighbors
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(hex_sync).neighbor_list();'

binary_sensor:
  - platform: template
    name: Sync leader
    entity_category: diagnostic
    lambda: 'return id(hex_sync).is_leader();'
